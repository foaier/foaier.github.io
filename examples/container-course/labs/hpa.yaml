# Requires a working metrics.k8s.io API. Not part of the default kind deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: course-api
  namespace: container-course
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: course-api
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
