name: foaier-nginx-labs
services:
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8088}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime:/etc/nginx/conf.d:ro
      - ./includes:/etc/nginx/course:ro
      - ./site:/srv/site:ro
      - ./downloads:/srv/downloads:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend-a
      - backend-b
  backend-a:
    image: node:22-alpine
    command: ["node", "/app/server.mjs"]
    environment:
      NODE_NAME: backend-a
    volumes:
      - ./backend:/app:ro
  backend-b:
    image: node:22-alpine
    command: ["node", "/app/server.mjs"]
    environment:
      NODE_NAME: backend-b
    volumes:
      - ./backend:/app:ro
