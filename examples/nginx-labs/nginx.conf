user nginx;
worker_processes 2;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format course escape=json '{"time":"$time_iso8601","id":"$request_id",'
        '"remote":"$remote_addr","request":"$request","status":$status,'
        '"duration":"$request_time","upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
        '"cache":"$upstream_cache_status","limit":"$limit_req_status"}';
    access_log /dev/stdout course;
    sendfile on;
    keepalive_timeout 30s;
    server_tokens off;
    include /etc/nginx/conf.d/*.conf;
}
