server {
    listen 80 default_server;
    server_name localhost;
    root /srv/site;
    location /api/ {
        proxy_pass http://backend-a:3000/;
        include /etc/nginx/course/proxy-headers.conf;
    }
    location /keep/ {
        proxy_pass http://backend-a:3000;
        include /etc/nginx/course/proxy-headers.conf;
    }
    location / { try_files $uri $uri/ =404; }
}
