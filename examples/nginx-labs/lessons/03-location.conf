server {
    listen 80 default_server;
    server_name localhost;
    root /srv/site;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location ^~ /assets/ { try_files $uri =404; }
    location ^~ /files/ { alias /srv/downloads/; autoindex off; }
    location ~ \.txt$ { default_type text/plain; return 200 "regex location\n"; }
    location /app/ { try_files $uri /index.html; }
    location = /old { return 302 /app/; }
    location / { try_files $uri $uri/ =404; }
}
