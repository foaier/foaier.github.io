upstream course_pool {
    zone course_pool 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend-a:3000 resolve max_fails=1 fail_timeout=5s;
    server backend-b:3000 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}
limit_req_zone $binary_remote_addr zone=project_api:10m rate=10r/s;
server {
    listen 80 default_server;
    server_name localhost;
    return 308 https://localhost:8443$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/site;
    client_max_body_size 1m;
    include /etc/nginx/course/security-headers.conf;
    gzip on;
    gzip_min_length 128;
    gzip_types text/css application/javascript application/json;
    gzip_vary on;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ /\. { deny all; }
    location /api/ {
        limit_req zone=project_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://course_pool/;
        include /etc/nginx/course/proxy-headers.conf;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1h;
        include /etc/nginx/course/security-headers.conf;
    }
    location = /index.html {
        add_header Cache-Control no-cache;
        include /etc/nginx/course/security-headers.conf;
    }
    location / { try_files $uri $uri/ /index.html; }
}
