limit_req_zone $binary_remote_addr zone=per_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
server {
    listen 80 default_server;
    server_name localhost;
    root /srv/site;
    client_max_body_size 1m;
    include /etc/nginx/course/security-headers.conf;
    location /api/ {
        limit_req zone=per_ip burst=3 nodelay;
        limit_req_status 429;
        limit_conn connections 5;
        limit_conn_status 429;
        proxy_pass http://backend-a:3000/;
        include /etc/nginx/course/proxy-headers.conf;
    }
    location ~ /\. { deny all; }
    location /internal/ { deny all; }
    location / { try_files $uri $uri/ =404; }
}
