server {
    listen 80 default_server;
    server_name localhost;
    root /srv/site;
    add_header X-Request-ID $request_id always;
    location /bad/ { proxy_pass http://127.0.0.1:3999/; proxy_connect_timeout 1s; }
    location /slow/ {
        proxy_pass http://backend-a:3000/slow;
        include /etc/nginx/course/proxy-headers.conf;
        proxy_read_timeout 1s;
    }
    location /forbidden/ { deny all; }
    location /api/ { proxy_pass http://backend-a:3000/; include /etc/nginx/course/proxy-headers.conf; }
    location / { try_files $uri $uri/ =404; }
}
