server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name course.local;
    root /srv/site;
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    server_name admin.local;
    default_type text/plain;
    location / { return 200 "admin virtual host\n"; }
}
