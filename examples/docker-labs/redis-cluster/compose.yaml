name: redis-cluster-lab
services:
  r1:
    image: redis:7.4-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no", "--cluster-announce-ip", "172.30.99.11"]
    volumes:
      - r1-data:/data
    networks:
      cluster:
        ipv4_address: 172.30.99.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15
