name: mysql-replication-lab
services:
  source:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
    command:
      - --server-id=101
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=604800
    volumes:
      - source-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
  replica:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
    command:
      - --server-id=102
      - --log-bin=mysql-bin
      - --relay-log=relay-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --skip-replica-start=ON
    volumes:
      - replica-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
volumes:
  source-data:
  replica-data:
