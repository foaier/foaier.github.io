server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notes}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:local-app-only}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:local-redis-only}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
demo.message=${DEMO_MESSAGE:hello-docker}
