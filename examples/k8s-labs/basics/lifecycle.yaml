apiVersion: v1
kind: Pod
metadata:
  name: lifecycle
  namespace: lab
spec:
  terminationGracePeriodSeconds: 30
  initContainers:
    - name: prepare
      image: busybox:1.37
      command: ["sh", "-c", "echo preparing; sleep 10; echo 'page prepared by init' > /site/index.html"]
      volumeMounts:
        - name: page
          mountPath: /site
  containers:
    - name: nginx
      image: nginx:1.28-alpine
      volumeMounts:
        - name: page
          mountPath: /usr/share/nginx/html
    - name: observer
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      volumeMounts:
        - name: page
          mountPath: /site
  volumes:
    - name: page
      emptyDir: {}
