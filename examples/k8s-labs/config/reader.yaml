apiVersion: v1
kind: Pod
metadata:
  name: config-reader
  namespace: lab
spec:
  containers:
    - name: reader
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      env:
        - name: MODE
          valueFrom:
            configMapKeyRef:
              name: settings
              key: MODE
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      volumeMounts:
        - name: settings
          mountPath: /etc/lab-config
          readOnly: true
        - name: password
          mountPath: /etc/lab-secret
          readOnly: true
  volumes:
    - name: settings
      configMap:
        name: settings
    - name: password
      secret:
        secretName: demo-secret
