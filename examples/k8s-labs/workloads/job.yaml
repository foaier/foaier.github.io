apiVersion: batch/v1
kind: Job
metadata:
  name: count-demo
  namespace: lab
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: counter
          image: busybox:1.37
          command: ["sh", "-c", "for n in 1 2 3; do echo item-$n; done"]
