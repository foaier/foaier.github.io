apiVersion: batch/v1
kind: CronJob
metadata:
  name: clock
  namespace: lab
spec:
  schedule: "*/1 * * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: clock
              image: busybox:1.37
              command: ["sh", "-c", "date; echo report-finished"]
