apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-note
  namespace: lab
spec:
  selector:
    matchLabels: {app: node-note}
  template:
    metadata:
      labels: {app: node-note}
    spec:
      containers:
        - name: note
          image: busybox:1.37
          command: ["sh", "-c", "echo running-on-$NODE_NAME; sleep 86400"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
