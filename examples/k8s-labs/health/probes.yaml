apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-web
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: probe-web}
  template:
    metadata:
      labels: {app: probe-web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          command: ["sh", "-c"]
          args: ["touch /tmp/ready /tmp/alive; exec nginx -g 'daemon off;'"]
          ports:
            - {name: http, containerPort: 80}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["test", "-f", "/tmp/ready"]}
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            exec: {command: ["test", "-f", "/tmp/alive"]}
            periodSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: probe-web
  namespace: lab
spec:
  selector: {app: probe-web}
  ports:
    - {port: 80, targetPort: http}
