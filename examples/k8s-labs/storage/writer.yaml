apiVersion: v1
kind: Pod
metadata:
  name: disk-writer
  namespace: lab
spec:
  containers:
    - name: shell
      image: busybox:1.37
      command: ["sleep", "86400"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: notes-data
