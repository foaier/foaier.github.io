apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: lab
spec:
  clusterIP: None
  selector: {app: ledger}
  ports:
    - {name: http, port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: lab
spec:
  serviceName: ledger
  replicas: 2
  selector:
    matchLabels: {app: ledger}
  template:
    metadata:
      labels: {app: ledger}
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - {name: http, containerPort: 80}
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: standard
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
