apiVersion: v1
kind: Namespace
metadata:
  name: quota-lab
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: quota-lab
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 32Mi}
      default: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: quota-lab
spec:
  hard:
    pods: "2"
    requests.cpu: "500m"
    requests.memory: 256Mi
    limits.memory: 512Mi
