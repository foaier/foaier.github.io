apiVersion: v1
kind: Pod
metadata:
  name: memory-demo
  namespace: lab
spec:
  restartPolicy: Never
  containers:
    - name: allocator
      image: python:3.13-alpine
      command: ["python", "-c", "import time; x=bytearray(256*1024*1024); time.sleep(60)"]
      resources:
        requests: {cpu: 50m, memory: 16Mi}
        limits: {cpu: 200m, memory: 64Mi}
