apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: notes.learning.foaier.local
spec:
  group: learning.foaier.local
  scope: Namespaced
  names:
    plural: notes
    singular: note
    kind: Note
    shortNames: [lnote]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [title, priority]
              properties:
                title:
                  type: string
                  minLength: 1
                priority:
                  type: integer
                  minimum: 1
                  maximum: 3
      additionalPrinterColumns:
        - name: Title
          type: string
          jsonPath: .spec.title
        - name: Priority
          type: integer
          jsonPath: .spec.priority
