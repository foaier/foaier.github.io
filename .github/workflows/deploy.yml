name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Validate article content
        run: npm run content:check
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ai-course
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compile course examples
        run: |
          for project in Core Integrations Workflows McpServer; do
            dotnet build "$project" --nologo
          done
      - name: Run offline course checks
        run: |
          dotnet run --no-build --project Core -- check
          dotnet run --no-build --project Integrations -- check-mcp
          for lesson in branch switch fanout loop composition checkpoint rollback resume-human diagram; do
            dotnet run --no-build --project Workflows -- "$lesson"
          done

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
